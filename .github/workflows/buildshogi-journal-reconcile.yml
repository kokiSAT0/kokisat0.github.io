# LOCAL CANDIDATE ONLY: independent read-only witness; never repairs or edits Issues.
name: BuildShogi journal read-only reconciliation
'on':
  workflow_dispatch:
permissions: {}
concurrency:
  group: buildshogi-journal-reconcile
  cancel-in-progress: false
jobs:
  witness:
    if: github.repository == 'kokiSAT0/kokisat0.github.io' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read existing failed run and two blocked Issues
        env:
          BUILDSHOGI_RECONCILIATION_APPROVED: 'true'
          BUILDSHOGI_CONCURRENCY: buildshogi-journal-reconcile
        run: python3 -B .github/scripts/buildshogi_reconcile.py --execute-approved-read-only
