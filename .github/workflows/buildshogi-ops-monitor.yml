# LOCAL PROPOSAL ONLY: one bootstrap; restore Phase1 read-only workflow afterwards.
name: BuildShogi operations monitor
'on':
  workflow_dispatch:
permissions: {}
concurrency:
  group: buildshogi-operations-monitor
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'kokiSAT0/kokisat0.github.io' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bootstrap two fixed blocked Issues once
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDSHOGI_BOOTSTRAP_APPROVED: 'true'
          BUILDSHOGI_CONCURRENCY: buildshogi-operations-monitor
        run: python3 -B .github/scripts/buildshogi_bootstrap.py --execute-approved-bootstrap
