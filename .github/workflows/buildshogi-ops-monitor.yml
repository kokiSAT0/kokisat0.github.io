# PHASE 1 REVIEW DRAFT ONLY: manual no-network baseline. No live monitor.
name: BuildShogi operations monitor
'on':
  workflow_dispatch:
permissions: {}
concurrency:
  group: buildshogi-operations-monitor
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'kokiSAT0/kokisat0.github.io' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Inactive baseline only
        run: python3 -B .github/scripts/buildshogi_monitor.py
